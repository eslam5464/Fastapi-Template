[project]
name = "FastApi-Template"
version = "0.1.0"
description = "A FastAPI project template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "b2sdk>=2.10.1",
    "email-validator>=2.3.0",
    "fastapi>=0.116.2",
    "gunicorn>=26.0.0",
    "httptools>=0.6.4 ; sys_platform == 'linux'",
    "loguru>=0.7.3",
    "pre-commit>=4.3.0",
    "psycopg>=3.3.2",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.43",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35.0",
    "uvloop>=0.21.0 ; sys_platform == 'linux'",
    "yarl>=1.20.1",
]

[project.optional-dependencies]
email = [
    "brevo-python>=4.0.7",
    "resend>=2.23.0",
]
cloud-service = [
    "firebase-admin>=7.1.0",
    "gcloud-aio-storage>=9.6.1",
]
cache = [
    "redis>=7.1.0",
]
task-queue = [
    "celery[redis]>=5.3.1",
    "redis>=7.1.0",
]
apple-services = [
    "app-store-server-library[async]>=2.0.0",
]

[dependency-groups]
test = [
    "faker>=37.8.0",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]
dev = [
    "bandit[toml]>=1.8.6",
    "black>=25.9.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.13.0",
    "types-aiofiles>=25.1.0",
]

[tool.black]
line-length = 100
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
    | .*/__init__.py
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 100
use_parentheses = true
ensure_newline_before_comments = true
remove_redundant_aliases = true
combine_as_imports = true
combine_star = true
skip_glob = [
    "*/__init__.py",
    "**/__pycache__/*",
    ".venv/*",
    "venv/*",
    "env/*"
]
skip = [
    ".gitignore",
    ".dockerignore",
    ".env",
    ".venv",
    "venv",
    "env",
    "__init__.py",
]
extend_skip = [".md", ".json"]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
default_section = "THIRDPARTY"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["app/alembic/versions", "tests"]

# Well-typed layers: enforce full annotation coverage. Scope intentionally kept to
# repos/models/services (per the "Moderate" strictness level chosen) rather than
# core/api/middleware/schemas, which have a long tail of small untyped helpers
# (custom exception __init__s, logger internals) not worth mass-annotating yet.
[[tool.mypy.overrides]]
module = ["app.repos.*", "app.models.*", "app.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Carve-out: third-party-SDK-heavy wrappers with weak/no upstream stubs.
# Revisit once b2sdk / firebase_admin / gcloud-aio-storage ship better types upstream.
[[tool.mypy.overrides]]
module = [
    "app.services.firebase",
    "app.services.firestore",
    "app.services.gcs",
    "app.services.back_blaze_b2",
    "app.services.payments.apple_pay",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party packages with missing/incomplete type stubs.
[[tool.mypy.overrides]]
module = [
    "b2sdk.*",
    "firebase_admin.*",
    "gcloud.*",
    "google.cloud.firestore.*",
    "jose.*",
    "celery.*",
    "gunicorn.*",
]
ignore_missing_imports = true

# Known mypy/pydantic-plugin limitation: mypy's "decorators on top of @property are
# not supported" check still fires on @computed_field + @property stacks in some
# mypy releases even with the pydantic plugin loaded. This is a false positive on a
# standard, documented pydantic v2 pattern, not a real typing bug in this module.
[[tool.mypy.overrides]]
module = ["app.core.config"]
disable_error_code = ["prop-decorator"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
addopts = """
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --no-cov-on-fail
"""
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running tests",
    "websocket: marks tests that use websocket connections"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
