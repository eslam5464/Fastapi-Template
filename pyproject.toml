[project]
name = "FastApi-Template"
version = "1.2.0"
description = "A FastAPI project template"
authors = [{ name = "Eslam", email = "eslam5464@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # --- FEATURE[gcs] START ---
    "aiofiles>=25.1.0",
    # --- FEATURE[gcs] END ---
    "alembic>=1.20.1",
    # --- FEATURE[apple_pay] START ---
    "app-store-server-library[async]>=2.0.0",
    # --- FEATURE[apple_pay] END ---
    "asyncpg>=0.32.0",
    # --- FEATURE[celery] START ---
    "celery[redis]>=5.3.1",
    # --- FEATURE[celery] END ---
    # --- FEATURE[backblaze] START ---
    "b2sdk>=2.13.3",
    # --- FEATURE[backblaze] END ---
    # --- FEATURE[brevo] START ---
    "brevo-python>=5.1.0",
    # --- FEATURE[brevo] END ---
    # --- FEATURE[auth|firebase] START ---
    "email-validator>=2.3.0",
    # --- FEATURE[auth|firebase] END ---
    # --- FEATURE[celery&auth] START ---
    "faker>=40.52.0",
    # --- FEATURE[celery&auth] END ---
    "fastapi>=0.162.2",
    # --- FEATURE[firebase] START ---
    "firebase-admin>=7.7.0",
    # --- FEATURE[firebase] END ---
    # --- FEATURE[gcs] START ---
    "gcloud-aio-storage>=9.6.5",
    # --- FEATURE[gcs] END ---
    "gunicorn>=26.2.0",
    "httptools>=0.9.0 ; sys_platform == 'linux'",
    # --- FEATURE[openobserve] START ---
    "httpx>=0.28.1",
    # --- FEATURE[openobserve] END ---
    "loguru>=0.7.3",
    # --- FEATURE[celery] START ---
    "psycopg[binary]>=3.3.4 ; sys_platform == 'win32'",
    "psycopg>=3.3.8 ; sys_platform != 'win32'",
    # --- FEATURE[celery] END ---
    # --- FEATURE[auth] START ---
    "pwdlib[argon2]>=0.3.0",
    # --- FEATURE[auth] END ---
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    # --- FEATURE[auth] START ---
    "python-jose>=3.5.0",
    "python-multipart>=0.0.33",
    # --- FEATURE[auth] END ---
    # --- FEATURE[redis] START ---
    "redis>=7.1.0",
    # --- FEATURE[redis] END ---
    # --- FEATURE[resend] START ---
    "resend>=2.53.0",
    # --- FEATURE[resend] END ---
    "sqlalchemy[asyncio]>=2.0.51",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.52.1",
    "uvloop>=0.23.0 ; sys_platform == 'linux'",
    "yarl>=1.25.1",
]

[dependency-groups]
test = [
    # anyio's pytest plugin (its own, not pytest-asyncio) is what runs every
    # @pytest.mark.anyio test in this suite - previously a transitive dep of
    # httpx/fastapi, made explicit since tests rely on it directly.
    "anyio>=4.16.0",
    "faker>=40.52.0",
    # The tests' HTTP client (httpx.AsyncClient against the app).
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "bandit[toml]>=1.9.4",
    # --- FEATURE[_template] START ---
    "commitizen>=4.19.3",
    # --- FEATURE[_template] END ---
    "detect-secrets>=1.5.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
    "tach>=0.35.3",
    # --- FEATURE[gcs] START ---
    "types-aiofiles>=25.1.0",
    # --- FEATURE[gcs] END ---
]
# --- FEATURE[_template] START ---
template = [
    "copier>=9.19.1",
]
# --- FEATURE[_template] END ---

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["app/alembic/versions"]
per-file-target-version = { "scripts/generate/*.py" = "py39" }

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes, replaces autoflake's unused import/variable
# job) + I (isort). Kept to what the previous tools already enforced rather than
# opting into new categories (UP, B, etc.) that would surface new findings.
select = ["E", "F", "I", "W"]
# E501 (line too long): ruff-format doesn't wrap comments/docstrings/strings to
# fit line-length (only code), same as black before it - lint-enforcing E501 on
# top of that just flags content the formatter was never going to fix anyway.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export names for the package's public API; F401 (unused
# import) and I001 (import order) previously didn't apply here either, since
# autoflake ran with --ignore-init-module-imports and isort skipped __init__.py
# outright - manual ordering there (e.g. base classes before dependents) matters.
"__init__.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["app/alembic/versions", "tests"]

# Well-typed layers: enforce full annotation coverage. Scope intentionally kept to
# repos/models/services (per the "Moderate" strictness level chosen) rather than
# core/api/middleware/schemas, which have a long tail of small untyped helpers
# (custom exception __init__s, logger internals) not worth mass-annotating yet.
[[tool.mypy.overrides]]
module = ["app.repos.*", "app.models.*", "app.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# --- FEATURE[firebase|gcs|backblaze|apple_pay] START ---
# Carve-out: third-party-SDK-heavy wrappers with weak/no upstream stubs.
# Revisit once these SDKs ship better types upstream.
[[tool.mypy.overrides]]
module = [
    # --- FEATURE[firebase] START ---
    "app.services.firebase",
    # --- FEATURE[firebase] END ---
    # --- FEATURE[firestore] START ---
    "app.services.firestore",
    # --- FEATURE[firestore] END ---
    # --- FEATURE[gcs] START ---
    "app.services.gcs",
    # --- FEATURE[gcs] END ---
    # --- FEATURE[backblaze] START ---
    "app.services.back_blaze_b2",
    # --- FEATURE[backblaze] END ---
    # --- FEATURE[apple_pay] START ---
    "app.services.payments.apple_pay",
    # --- FEATURE[apple_pay] END ---
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# --- FEATURE[firebase|gcs|backblaze|apple_pay] END ---

# Service-specific exception modules retain their existing untyped constructors.
[[tool.mypy.overrides]]
module = [
    # --- FEATURE[firebase] START ---
    "app.services.exceptions.firebase",
    # --- FEATURE[firebase] END ---
    # --- FEATURE[gcs] START ---
    "app.services.exceptions.gcs",
    # --- FEATURE[gcs] END ---
    # --- FEATURE[backblaze] START ---
    "app.services.exceptions.backblaze",
    # --- FEATURE[backblaze] END ---
    # --- FEATURE[apple_pay] START ---
    "app.services.exceptions.apple_pay",
    # --- FEATURE[apple_pay] END ---
    # --- FEATURE[redis_rate_limit] START ---
    "app.services.exceptions.rate_limiter",
    # --- FEATURE[redis_rate_limit] END ---
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party packages with missing/incomplete type stubs.
[[tool.mypy.overrides]]
module = [
    # --- FEATURE[backblaze] START ---
    "b2sdk.*",
    # --- FEATURE[backblaze] END ---
    # --- FEATURE[firebase] START ---
    "firebase_admin.*",
    # --- FEATURE[firebase] END ---
    # --- FEATURE[gcs] START ---
    "gcloud.*",
    # --- FEATURE[gcs] END ---
    # --- FEATURE[firestore] START ---
    "google.cloud.firestore.*",
    # --- FEATURE[firestore] END ---
    # --- FEATURE[auth] START ---
    "jose.*",
    # --- FEATURE[auth] END ---
    # --- FEATURE[celery] START ---
    "celery.*",
    # --- FEATURE[celery] END ---
    "gunicorn.*",
]
ignore_missing_imports = true

# Known mypy/pydantic-plugin limitation: mypy's "decorators on top of @property are
# not supported" check still fires on @computed_field + @property stacks in some
# mypy releases even with the pydantic plugin loaded. This is a false positive on a
# standard, documented pydantic v2 pattern, not a real typing bug in this module.
[[tool.mypy.overrides]]
module = ["app.core.config"]
disable_error_code = ["prop-decorator"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic/versions"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.2.0"
version_files = ["pyproject.toml:version"]
tag_format = "$version"
update_changelog_on_bump = true

[tool.coverage.run]
# Without this, coverage.py records absolute file paths in .coverage. The
# python-coverage-comment-action CI step re-reads that file from inside its own
# Docker container, where the workspace is mounted at a different absolute path
# than the runner checkout - relative paths resolve correctly in both.
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
addopts = """
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --no-cov-on-fail
"""
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running tests",
    "websocket: marks tests that use websocket connections"
]
