services:
  backend:
    image: fastapi_template_backend
    container_name: fastapi_template_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8799:8799"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bare names pass through from the --env-file/.env so the backend receives the
    # full environment app/core/config.py requires. Only the hosts that must point
    # at compose services are overridden (POSTGRES_HOST=db, REDIS_HOST=redis).
    environment:
      - CURRENT_ENVIRONMENT
      - DEBUG
      - BACKEND_HOST
      - BACKEND_PORT
      - CORS_ORIGINS
      - ALLOWED_HOSTS
      - WORKERS_COUNT
      - POSTGRES_HOST=db
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_DB_SCHEMA
      - FIREBASE_PROJECT_ID
      - FIREBASE_PRIVATE_KEY_ID
      - FIREBASE_PRIVATE_KEY
      - FIREBASE_CLIENT_EMAIL
      - FIREBASE_CLIENT_ID
      - REDIS_HOST=redis
      - REDIS_PORT
      - REDIS_PASS
      - REDIS_USER
      - REDIS_BASE
      - REDIS_MAX_POOL_CONNECTIONS
      - REDIS_SOCKET_CONNECT_TIMEOUT
      - REDIS_SOCKET_TIMEOUT
      - CACHE_ENABLED
      - CACHE_TTL_DEFAULT
      - CACHE_TTL_SHORT
      - CACHE_TTL_LONG
      - CACHE_TTL_VERY_LONG
      - RATE_LIMIT_ENABLED
      - RATE_LIMIT_DEFAULT
      - RATE_LIMIT_WINDOW
      - RATE_LIMIT_STRICT
      - RATE_LIMIT_LENIENT
      - RATE_LIMIT_USER
      - SECRET_KEY
      - ACCESS_TOKEN_EXPIRE_SECONDS
      - REFRESH_TOKEN_EXPIRE_SECONDS
      - LOG_TO_OPENOBSERVE
      - OPENOBSERVE_URL
      - OPENOBSERVE_ORG_ID
      - OPENOBSERVE_STREAM_NAME
      - OPENOBSERVE_ACCESS_KEY
      - OPENOBSERVE_BATCH_SIZE
      - OPENOBSERVE_FLUSH_INTERVAL
      - APPLE_PAY_STORE_PRIVATE_KEY_ID
      - APPLE_PAY_STORE_PRIVATE_KEY
      - APPLE_PAY_STORE_PRIVATE_KEY_PATH
      - APPLE_PAY_STORE_ISSUER_ID
      - APPLE_PAY_STORE_BUNDLE_ID
      - APPLE_PAY_STORE_ROOT_CERTIFICATE_PATH
      - ENABLE_DATA_SEEDING
      - SEEDING_USER_COUNT
      - RESEND_API_KEY
      - BREVO_API_KEY
    deploy:
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 3
        window: 10s
    networks:
      - fastapi_template_network
  db:
    image: postgres:18-alpine
    # Capped so a misconfigured service stops and shows as failed instead of
    # crash-looping forever (it does not come back after a host reboot - use
    # `unless-stopped` in a deployment that needs that).
    restart: on-failure:5
    container_name: fastapi_template_db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_DB_SCHEMA
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # postgres 18+ images store data under /var/lib/postgresql/<major>/ and refuse
      # to start with a volume mounted at the pre-18 /var/lib/postgresql/data path.
      - fastapi_template_db_data:/var/lib/postgresql
    networks:
      - fastapi_template_network
  redis:
    image: redis:8-alpine
    restart: on-failure:5
    container_name: fastapi_template_redis
    # The redis image ignores env vars for auth, so configure it on the command
    # line: --requirepass sets the default user's password, and the ACL `user`
    # directive creates the REDIS_USER the app authenticates as (see
    # app/core/config.py's redis_url). The port stays internal to the network.
    # Each ACL token is its own argv element: redis re-quotes argv items that
    # contain spaces, which would turn a single multi-word rule into an
    # invalid username ("Spaces not allowed in ACL usernames").
    command: ["redis-server", "--requirepass", "${REDIS_PASS}", "--user", "${REDIS_USER}", "on", ">${REDIS_PASS}", "~*", "&*", "+@all"]
    environment:
      - REDIS_USER
      - REDIS_PASS
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning --user "$${REDIS_USER}" --pass "$${REDIS_PASS}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fastapi_template_network

networks:
  fastapi_template_network:
    name: fastapi_template
    driver: bridge

volumes:
  fastapi_template_db_data:
    name: fastapi_template_db_data
    driver: local
