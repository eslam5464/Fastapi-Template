name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint, types, security (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      # Runs the exact same hooks defined in .pre-commit-config.yaml (black, isort,
      # autoflake, mypy, bandit, detect-secrets) as a required status check - so a
      # contributor who never installed pre-commit locally still gets blocked, and
      # this stays a single source of truth alongside pre-commit.ci.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    # Needed by python-coverage-comment-action to post/update the PR comment and
    # store badge data on an orphan branch. Note: GITHUB_TOKEN is read-only for
    # pull_request events from forks regardless of this block - the coverage
    # comment step will just no-op for external-contributor PRs until this repo
    # adopts the action's two-workflow (workflow_run) pattern for forks.
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # postgresql+psycopg (used for the sync engine / Celery) needs libpq at import
      # time, not just at connection time - matches the Dockerfile's `apk add
      # postgresql-dev` / `postgresql-libs` for the same reason.
      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Configure environment
        run: |
          cp .env.example .env
          # .env.example's Redis defaults assume auth; our service container runs
          # without a password, so clear both to avoid an unwanted AUTH attempt.
          sed -i 's/^REDIS_PASS=.*/REDIS_PASS=/' .env
          sed -i 's/^REDIS_USER=.*/REDIS_USER=/' .env

      - name: Create test database
        run: >
          uv run python -c "import psycopg; conn = psycopg.connect('host=localhost port=5432
          user=postgres password=1234 dbname=postgres', autocommit=True);
          conn.execute('CREATE DATABASE postgres_test'); conn.close()"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
