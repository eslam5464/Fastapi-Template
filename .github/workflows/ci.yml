name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint, types, security (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      # Runs the exact same hooks defined in .pre-commit-config.yaml (ruff, tach,
      # mypy, bandit, detect-secrets, check-jsonschema) as a required status check -
      # so a contributor who never installed pre-commit locally still gets blocked,
      # and this stays a single source of truth alongside pre-commit.ci. The
      # commitizen hook is commit-msg-staged only and doesn't run in --all-files.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    # Needed by python-coverage-comment-action to post/update the PR comment and
    # store badge data on an orphan branch. Note: GITHUB_TOKEN is read-only for
    # pull_request events from forks regardless of this block - the coverage
    # comment step will just no-op for external-contributor PRs until this repo
    # adopts the action's two-workflow (workflow_run) pattern for forks.
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # postgresql+psycopg (used for the sync engine / Celery) needs libpq at import
      # time, not just at connection time - matches the Dockerfile's `apk add
      # postgresql-dev` / `postgresql-libs` for the same reason.
      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Configure environment
        run: |
          cp .env.example .env
          # BaseRedisClient.redis_client always returns None when
          # current_environment == LOCAL (a deliberate safety guard for local dev
          # without Redis running) - which breaks the rate-limiter/token-blacklist
          # tests that rely on a real (mocked) client. "dev" keeps CORS/docs/CSRF
          # behavior sane while allowing Redis to actually be used, matching what
          # local dev already runs with.
          sed -i 's/^CURRENT_ENVIRONMENT=.*/CURRENT_ENVIRONMENT=dev/' .env
          # Match the postgres service container's credentials above.
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=postgres/' .env
          # .env.example's Redis defaults assume auth; our service container runs
          # without a password, so clear both to avoid an unwanted AUTH attempt.
          sed -i 's/^REDIS_PASS=.*/REDIS_PASS=/' .env
          sed -i 's/^REDIS_USER=.*/REDIS_USER=/' .env

      # `app/services/payments/apple_pay.py` constructs a module-level ApplePay()
      # singleton at import time, which eagerly PEM-parses the private key. Real
      # API calls are always mocked in tests, but the key still has to be a
      # syntactically valid PEM or importing the module (and therefore collecting
      # any apple_pay test file) crashes before a single test runs. Similarly,
      # decode_transaction_info()/webhook verification eagerly read the root
      # certificate file's bytes as a SignedDataVerifier constructor argument
      # before that (mocked-in-tests) class is invoked, so the path needs to
      # exist and be readable even though its content is never really parsed
      # under test. .env.example's values are intentionally empty/placeholder
      # (real credentials, not runnable as-is), so throwaway files are generated
      # here and wired in via the existing *_PATH file-based credential loading.
      - name: Generate dummy Apple Pay test credentials
        run: |
          uv run python -c "from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; key = ec.generate_private_key(ec.SECP256R1()); open('apple_pay_test_key.p8', 'wb').write(key.private_bytes(encoding=serialization.Encoding.PEM, format=serialization.PrivateFormat.PKCS8, encryption_algorithm=serialization.NoEncryption()))"
          echo "dummy cert content for CI tests" > apple_pay_test_root_ca.cer
          sed -i 's#^APPLE_PAY_STORE_PRIVATE_KEY_PATH=.*#APPLE_PAY_STORE_PRIVATE_KEY_PATH=apple_pay_test_key.p8#' .env
          sed -i 's#^APPLE_PAY_STORE_ROOT_CERTIFICATE_PATH=.*#APPLE_PAY_STORE_ROOT_CERTIFICATE_PATH=apple_pay_test_root_ca.cer#' .env

      - name: Create test database
        run: >
          uv run python -c "import psycopg; conn = psycopg.connect('host=localhost port=5432
          user=postgres password=postgres dbname=postgres', autocommit=True);
          conn.execute('CREATE DATABASE postgres_test'); conn.close()"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Badge color thresholds: green >=90%, orange >=70%, red below.
          MINIMUM_GREEN: "90"
          MINIMUM_ORANGE: "70"
