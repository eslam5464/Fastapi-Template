_min_copier_version: "9.15.0"

project_name:
  type: str
  help: "Human-readable project name"
  default: "FastAPI Template"

project_slug:
  type: str
  help: "Slug used for package/container/schema naming (lowercase, hyphen-separated)"
  default: "{{ project_name.lower() | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: "Short description used in pyproject.toml and README"
  default: "A production-ready FastAPI backend with async PostgreSQL and clean architecture."

author_name:
  type: str
  help: "Your name, used in LICENSE copyright"
  default: "Eslam"

author_email:
  type: str
  help: "Your email, used in pyproject.toml's [project.authors]"
  default: "eslam5464@users.noreply.github.com"

github_username:
  type: str
  help: "GitHub username or org, used in README badges and CODEOWNERS"
  default: "eslam5464"

python_version:
  type: str
  help: "Python version to target (minimum 3.14 - this template's application code uses Python 3.14+ only syntax, e.g. PEP 758 except clauses)"
  default: "3.14"
  validator: >-
    {% set parts = python_version.split('.') %}
    {% if parts | length < 2 or parts[0] | int != 3 or parts[1] | int < 14 %}
    Python version must be 3.14 or higher (this template's application code requires it).
    {% endif %}

services:
  type: str
  help: "Optional services: keep the minimal base, choose services one by one, or include everything?"
  choices:
    "Minimal base (no optional services)": minimal
    "Choose services one by one": custom
    "All services": full
  default: "{{ 'full' if _copier_conf.defaults else 'minimal' }}"

include_auth:
  type: bool
  help: "Include JWT authentication with the User model (signup, login, token refresh, logout, /users/me)? Adds SECRET_KEY and the token settings."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_example_items:
  type: bool
  help: "Include an example CRUD domain, Items (model, repository, service, /v1/items endpoints, migration, tests)? Its routes need a login when authentication is included."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_api_v2:
  type: bool
  help: "Include an empty second API version (/v2, mounted with its own docs)?"
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_csrf:
  type: bool
  help: "Include the CSRF middleware (X-CSRF-Token must match the csrf_token cookie; for browser clients that authenticate with cookies)?"
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_redis_cache:
  type: bool
  help: "Include the Redis cache (cache_manager, @cache_result)? Any Redis-backed choice adds Redis to the settings, docker-compose and CI."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_redis_rate_limit:
  type: bool
  help: "Include Redis-backed rate limiting (per IP address; per user and on the auth routes when authentication is included)? Adds the RATE_LIMIT_* settings."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_redis_token_blacklist:
  type: bool
  help: "Include the Redis token blacklist, so logout revokes tokens? Without it, logged-out tokens stay valid until they expire."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' and include_auth }}"

include_celery:
  type: bool
  help: "Include Celery background jobs (worker, beat, sync DB engine)? Uses Redis as the broker."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_firebase:
  type: bool
  help: "Include Firebase (Admin SDK: authentication, users, push notifications)? Adds the FIREBASE_* settings."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_firestore:
  type: bool
  help: "Include Firestore (document database, uses the Firebase credentials)?"
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' and include_firebase }}"

include_gcs:
  type: bool
  help: "Include Google Cloud Storage (gcloud-aio-storage, aiofiles)?"
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_backblaze:
  type: bool
  help: "Include BackBlaze B2 cloud storage (b2sdk)?"
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_resend:
  type: bool
  help: "Include the Resend email provider? Adds RESEND_API_KEY."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_brevo:
  type: bool
  help: "Include the Brevo email provider? Adds BREVO_API_KEY."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_openobserve:
  type: bool
  help: "Include OpenObserve log shipping (httpx)? Adds the LOG_TO_OPENOBSERVE and OPENOBSERVE_* settings."
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

include_apple_pay:
  type: bool
  help: "Include the Apple Pay in-app purchase verification module?"
  default: "{{ services == 'full' }}"
  when: "{{ services == 'custom' }}"

_exclude:
  # Copier's built-in defaults (https://copier.readthedocs.io/en/stable/configuring/#exclude) -
  # defining _exclude replaces them entirely rather than extending them, so they must be
  # restored explicitly or every generated project ships this template's own .git history,
  # __pycache__ dirs, etc.
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - ".github/workflows/template-ci.yml"

_tasks:
  - ["{{ _copier_python }}", "scripts/generate/post_gen.py",
     "--project-name", "{{ project_name }}",
     "--project-slug", "{{ project_slug }}",
     "--project-description", "{{ project_description }}",
     "--author-name", "{{ author_name }}",
     "--author-email", "{{ author_email }}",
     "--github-username", "{{ github_username }}",
     "--python-version", "{{ python_version }}",
     "--features-json", "{{ {'services': services, 'include_auth': include_auth, 'include_example_items': include_example_items, 'include_api_v2': include_api_v2, 'include_csrf': include_csrf, 'include_redis_cache': include_redis_cache, 'include_redis_rate_limit': include_redis_rate_limit, 'include_redis_token_blacklist': include_redis_token_blacklist, 'include_celery': include_celery, 'include_firebase': include_firebase, 'include_firestore': include_firestore, 'include_gcs': include_gcs, 'include_backblaze': include_backblaze, 'include_resend': include_resend, 'include_brevo': include_brevo, 'include_openobserve': include_openobserve, 'include_apple_pay': include_apple_pay} | tojson }}"]
